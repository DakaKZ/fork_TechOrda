stages:
  - deploy
  - test

deploy:
  stage: deploy
  image: docker:24.0.5
  services:
    - docker:24.0.5-dind
  script:
    - docker compose -f docker-compose.yml up -d
  only:
    - main

test:
  stage: test
  image: curlimages/curl
  script:
    - |
      echo "Ждём запуск S3 интерфейса..."
      sleep 10
      curl -f http://localhost:8333
  only:
    - main

